<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hanuman's Leap</title>
<meta name="description" content="Leap across the ocean with Hanuman, from Mahendra mountain to Lanka, in a devotional arcade journey from the Sundara Kanda.">
<meta name="theme-color" content="#1b1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Yatra+One&display=swap">
<!--CRAZYGAMES_SDK-->
<style>
:root{--saffron:#ff9933;--gold:#ffc83d;--indigo:#1b1440;--ink:#2a1206;--cream:#fff4dc;--pink:#ff8fc0}
html,body{margin:0;height:100%;background:#0d0a24;overflow:hidden;color:var(--cream);
  font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
#wrap{position:fixed;inset:0}
#cv{position:absolute;left:0;top:0;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui button{pointer-events:auto;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
#safe{position:absolute;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--ink);background:rgba(255,244,220,.92);color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink)}
.ib svg{width:24px;height:24px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ib[aria-disabled=true]{opacity:.55}
#touch{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px)}
.pad{display:flex;gap:12px;align-items:flex-end}
.tb{width:70px;height:70px;border-radius:50%;border:3px solid rgba(42,18,6,.85);background:rgba(255,244,220,.32);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;padding:0;text-shadow:0 1px 2px #000;touch-action:none;backdrop-filter:blur(2px)}
.tb svg{width:30px;height:30px}
.tb.on{background:rgba(255,200,61,.65)}
.tb.fly{width:96px;height:96px;font-size:20px;background:rgba(255,153,51,.5)}
.tb.sm{width:62px;height:62px;font-size:13px;flex-direction:column}
#bGlow{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:56px;padding:0 22px;border-radius:28px;border:3px solid var(--ink);background:radial-gradient(#fff3b0,#ffc83d 60%,#ff9933);color:var(--ink);font-weight:800;font-size:18px;touch-action:none;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px 6px rgba(255,200,61,.8)}}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,30,.6);pointer-events:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);box-sizing:border-box}
.card{background:linear-gradient(#33246b,#1b1440);border:3px solid var(--gold);border-radius:18px;padding:14px 22px 18px;max-width:min(560px,94vw);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h2{font-family:'Yatra One','Baloo 2',Georgia,serif;font-weight:400;color:var(--gold);margin:2px 0 0;font-size:clamp(24px,4.2vh,34px);line-height:1.15}
.card .sub{opacity:.9;margin:2px 0 6px;font-size:16px}
.stars{font-size:clamp(30px,7vh,46px);letter-spacing:6px;line-height:1.1;color:#5a4a8a}
.stars .on{color:var(--gold);text-shadow:0 0 12px rgba(255,200,61,.7)}
.sum{margin:6px auto;border-collapse:collapse;font-size:16px;min-width:280px}
.sum td{padding:1px 8px}.sum td:last-child{text-align:right;font-weight:700}
.sum tr.tot td{border-top:1px solid rgba(255,244,220,.3);font-size:19px;color:var(--gold);padding-top:4px}
.goals{font-size:14px;opacity:.9;margin:4px 0 8px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{min-height:48px;min-width:130px;padding:6px 16px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(#ffd45e,#ff9933);color:var(--ink);font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#43378a;color:var(--cream)}
.row.eq .btn{flex:1 1 0;min-width:0}
.btn svg{width:22px;height:22px;flex:none}
.msg{min-height:20px;color:#ffb3b3;font-size:15px;margin-top:6px}
.keys{font-size:14px;opacity:.85;margin-top:8px;line-height:1.5}
kbd{background:#fff4dc;color:var(--ink);border-radius:5px;padding:0 6px;font-family:inherit;font-weight:700;font-size:13px}
#mapS{flex-direction:column;background:#0f1d4a;justify-content:flex-start}
#mapS header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1100px;gap:10px}
#mapS h2{font-family:'Yatra One','Baloo 2',Georgia,serif;font-weight:400;color:var(--gold);margin:0;font-size:clamp(22px,5vh,32px)}
#mapSvg{flex:1;width:100%;max-width:1100px;min-height:0}
#mapSvg .node{cursor:pointer}
#mapSvg .node:focus{outline:none}
#mapSvg .node:focus circle.ring{stroke:#fff}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);background:rgba(27,20,64,.95);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-weight:700;font-size:16px;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#adShield{position:absolute;inset:0;pointer-events:auto;background:transparent}
#rotate{display:none;position:absolute;inset:0;background:#1b1440;align-items:center;justify-content:center;flex-direction:column;font-size:20px;font-weight:700;text-align:center;pointer-events:auto;gap:12px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
.mockad{position:fixed;inset:0;background:#000;color:#fff;display:grid;place-items:center;font:700 28px system-ui;z-index:99}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="safe"></div>
  <div id="ui">
    <div id="topbar">
      <button class="ib" id="bMap" aria-label="Journey map" title="Journey map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg></button>
      <button class="ib" id="bMute" aria-label="Sound on" title="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mWave" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/><path id="mX" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button>
      <button class="ib" id="bPause" aria-label="Pause" title="Pause (Esc)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    </div>
    <div id="touch" hidden>
      <div class="pad">
        <button class="tb" data-k="left" aria-label="Slow down"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4L6 12l9 8z"/></svg></button>
        <button class="tb" data-k="right" aria-label="Speed up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4l9 8-9 8z"/></svg></button>
      </div>
      <div class="pad">
        <button class="tb sm" data-k="shrink" aria-label="Shrink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 4l6 6M20 4l-6 6M4 20l6-6M20 20l-6-6"/></svg>Shrink</button>
        <button class="tb sm" data-k="grow" aria-label="Grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M10 10L4 4m0 5V4h5M14 10l6-6m0 5V4h-5M10 14l-6 6m0-5v5h5M14 14l6 6m0-5v5h-5"/></svg>Grow</button>
        <button class="tb fly" data-k="fly" aria-label="Fly">FLY</button>
      </div>
    </div>
    <button id="bGlow" data-k="glow" hidden>✦ Golden glow</button>
    <div id="scr" class="screen" hidden><div class="card" id="card"></div></div>
    <div id="mapS" class="screen" hidden>
      <header><h2>The Journey to Lanka</h2><button class="btn ghost" id="mapBack">Back</button></header>
      <svg id="mapSvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="toast" hidden></div>
    <div id="adShield" hidden></div>
    <div id="rotate"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ffc83d" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M8 3a9 9 0 019 2l-1.5 1.5M17 5V2"/></svg>Turn your phone sideways to play</div>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   Hanuman's Leap — a Sundara Kanda arcade journey
   Sections: utils · Save · Sound · CrazyGames adapter · Input ·
             View · Art · Level base · Level 1 · Game flow · Loop
   ============================================================ */

// ---------- utils ----------
const VH = 540, STEP = 1 / 240, TAU = Math.PI * 2, INK = '#2a1206';
const UIF = "'Baloo 2', system-ui, -apple-system, 'Segoe UI', sans-serif";
const TF = "'Yatra One', 'Baloo 2', Georgia, serif";
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function text(c, s, x, y, o = {}) {
  c.font = `${o.w || 800} ${o.size || 22}px ${o.font || UIF}`;
  c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'middle';
  if (o.stroke !== false) { c.lineWidth = o.lw || 5; c.strokeStyle = o.sc || INK; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = o.color || '#fff4dc'; c.fillText(s, x, y);
}
const fmtTime = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------- Save (localStorage, always guarded) ----------
const Save = {
  key: 'hanumansLeap.v1', data: { unlocked: 1, best: {}, muted: false },
  load() {
    try {
      const d = JSON.parse(localStorage.getItem(this.key));
      if (d && typeof d === 'object') {
        this.data.unlocked = clamp(d.unlocked | 0, 1, 7);
        this.data.best = d.best && typeof d.best === 'object' ? d.best : {};
        this.data.muted = !!d.muted;
      }
    } catch (e) { /* storage blocked: play without saves */ }
  },
  store() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  record(id, score, stars) {
    const b = this.data.best[id] || { score: 0, stars: 0 };
    const isBest = score > b.score;
    b.score = Math.max(b.score, score); b.stars = Math.max(b.stars, stars);
    this.data.best[id] = b; this.data.unlocked = Math.max(this.data.unlocked, Math.min(7, id + 1));
    this.store(); return isBest;
  }
};

// ---------- Sound (Web Audio only) ----------
const Sound = {
  ctx: null, out: null, music: null, sfx: null, noise: null,
  muted: false, sdkMuted: false, adMuted: false, next: 0, fluteAt: 0, step: 0,
  get on() { return !(this.muted || this.sdkMuted || this.adMuted); },
  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.out = c.createGain(); this.out.gain.value = 0; this.out.connect(c.destination);
    this.music = c.createGain(); this.music.gain.value = .6; this.music.connect(this.out);
    this.sfx = c.createGain(); this.sfx.gain.value = .8; this.sfx.connect(this.out);
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    // sustained drone on Sa (D) and Pa (A)
    [[73.42, .05], [110, .022], [146.83, .028]].forEach(([f, g]) => {
      const o = c.createOscillator(), fl = c.createBiquadFilter(), gn = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 380; gn.gain.value = g;
      o.connect(fl); fl.connect(gn); gn.connect(this.music); o.start();
    });
    this.next = c.currentTime + .1; this.fluteAt = c.currentTime + 5;
    this.apply(); this.resume();
  },
  apply() { if (this.ctx) this.out.gain.setTargetAtTime(this.on ? 1 : 0, this.ctx.currentTime, .04); },
  setAd(on) { this.adMuted = on; this.apply(); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resume() { if (this.ctx && this.ctx.state !== 'running' && !document.hidden) this.ctx.resume().catch(() => {}); },
  tick() {
    const c = this.ctx; if (!c || c.state !== 'running') return;
    const now = c.currentTime; if (this.next < now) this.next = now + .05;
    const seq = [220, 293.66, 293.66, 146.83]; // tanpura: Pa Sa' Sa' Sa
    while (this.next < now + .25) { this.pluck(seq[this.step % 4], this.next); this.step++; this.next += .62; }
    if (now > this.fluteAt) { this.phrase(now + .1); this.fluteAt = now + 10 + Math.random() * 8; }
  },
  pluck(f, t) {
    const c = this.ctx, fl = c.createBiquadFilter(), g = c.createGain();
    fl.type = 'lowpass'; fl.Q.value = 3; fl.frequency.setValueAtTime(2200, t); fl.frequency.exponentialRampToValueAtTime(450, t + 1.8);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.04, t + .02); g.gain.exponentialRampToValueAtTime(.0005, t + 2.4);
    fl.connect(g); g.connect(this.music);
    [1, 1.003].forEach(m => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * m; o.connect(fl); o.start(t); o.stop(t + 2.5); });
  },
  phrase(t) { // bansuri-like phrase in raga Bhupali (Sa Re Ga Pa Dha)
    const sc = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99];
    let i = 3 + (Math.random() * 3 | 0); const n = 4 + (Math.random() * 3 | 0);
    for (let k = 0; k < n; k++) {
      const dur = k === n - 1 ? 1.2 : .3 + Math.random() * .35;
      this.flute(sc[i], t, dur); t += dur * .92;
      i = clamp(i + (Math.random() < .5 ? -1 : 1) * (Math.random() < .7 ? 1 : 2), 0, sc.length - 1);
    }
  },
  flute(f, t, dur) {
    const c = this.ctx, o = c.createOscillator(), v = c.createOscillator(), vg = c.createGain(), g = c.createGain(), fl = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = f; v.frequency.value = 5.2; vg.gain.value = f * .006;
    v.connect(vg); vg.connect(o.frequency); fl.type = 'lowpass'; fl.frequency.value = 2400;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .08); g.gain.setValueAtTime(.045, t + dur * .8); g.gain.linearRampToValueAtTime(0, t + dur + .15);
    o.connect(fl); fl.connect(g); g.connect(this.music); o.start(t); v.start(t); o.stop(t + dur + .2); v.stop(t + dur + .2);
  },
  chime(hi) {
    const c = this.ctx; if (!c) return; const t = c.currentTime, base = hi ? 1318.5 : 987.77;
    [1, 2.76, 5.4].forEach((m, i) => {
      const o = c.createOscillator(), g = c.createGain(); o.frequency.value = base * m;
      g.gain.setValueAtTime(.12 / (i + 1), t); g.gain.exponentialRampToValueAtTime(.0005, t + 1.1 / (i * .6 + 1));
      o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + 1.2);
    });
  },
  whoosh(up) {
    const c = this.ctx; if (!c) return; const t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(up ? 400 : 2400, t); f.frequency.exponentialRampToValueAtTime(up ? 2600 : 300, t + .38);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .08); g.gain.exponentialRampToValueAtTime(.001, t + .45);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t); s.stop(t + .5);
  },
  drum(vol = .7) {
    const c = this.ctx; if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .35);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + .65);
  },
  chord() { // bright Sa-Ga-Pa bell chord for glow / leap / win
    const c = this.ctx; if (!c) return; const t = c.currentTime;
    [587.33, 739.99, 880, 1174.66].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * .07); g.gain.linearRampToValueAtTime(.08, t + i * .07 + .02); g.gain.exponentialRampToValueAtTime(.0005, t + i * .07 + 1.6);
      o.connect(g); g.connect(this.sfx); o.start(t + i * .07); o.stop(t + i * .07 + 1.7);
    });
  }
};

// ---------- CrazyGames SDK v3 adapter (inert without the SDK) ----------
(function mockSdk() { // ?cgmock=1 | error | adblock — local testing of the ad flows
  const m = /[?&]cgmock=(\w+)/.exec(location.search); if (!m || window.CrazyGames) return;
  const mode = m[1], log = (...a) => console.log('[CG mock]', ...a);
  window.CrazyGames = { SDK: {
    environment: 'crazygames', init: async () => log('init'),
    game: { settings: { muteAudio: false }, gameplayStart: () => log('gameplayStart'), gameplayStop: () => log('gameplayStop'), happytime: () => log('happytime'), addSettingsChangeListener() {} },
    ad: { hasAdblock: async () => mode === 'adblock', requestAd(type, cb) {
      log('requestAd', type);
      if (mode === 'error') { setTimeout(() => cb.adError && cb.adError({ code: 'unfilled' }), 300); return; }
      const d = document.createElement('div'); d.className = 'mockad'; d.textContent = `Mock ${type} ad`;
      setTimeout(() => { document.body.appendChild(d); cb.adStarted && cb.adStarted(); }, 250);
      setTimeout(() => { d.remove(); cb.adFinished && cb.adFinished(); }, 2200);
    } }
  } };
})();

const CG = {
  sdk: null, env: 'none', active: false, adPlaying: false, adblock: false, lastMid: -1e9,
  get on() { return !!this.sdk; },
  async init() {
    const s = window.CrazyGames && window.CrazyGames.SDK; if (!s) return;
    try {
      await Promise.race([s.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))]);
      this.env = s.environment;
      if (this.env === 'disabled') return;
      this.sdk = s;
      try { this.adblock = !!(await s.ad.hasAdblock()); } catch (e) { this.adblock = false; }
      const applyMute = st => { Sound.sdkMuted = !!(st && st.muteAudio); Sound.apply(); UI.syncMute(); };
      try { applyMute(s.game.settings); s.game.addSettingsChangeListener(applyMute); } catch (e) {}
      const was = this.active; this.active = false; this.setGameplay(was); // gameplay may have begun before init resolved
    } catch (e) { this.sdk = null; }
  },
  setGameplay(on) {
    if (on === this.active) return; this.active = on;
    if (!this.sdk) return;
    try { on ? this.sdk.game.gameplayStart() : this.sdk.game.gameplayStop(); } catch (e) {}
  },
  happytime() { if (this.sdk) try { this.sdk.game.happytime(); } catch (e) {} },
  _ad(type, cbs) {
    this.setGameplay(false); this.adPlaying = true; Input.reset(); Input.blocked = true; UI.shield(true);
    let done = false;
    const end = ok => {

    const best = Save.data.best, total = LEVELS.reduce((a, d) => a + ((best[d.id] || {}).score || 0), 0), stars = LEVELS.reduce((a, d) => a + ((best[d.id] || {}).stars || 0), 0);
    UI.card(`<h2>The journey is complete</h2><div class="sub">Hanuman crossed the ocean, found Sita Maa in the Ashok Vatika, and carries hope back to Rama. Jai Shri Ram!</div>
      <table class="sum">${LEVELS.map(d => { const b = best[d.id] || { score: 0, stars: 0 }; return `<tr><td>${d.id}. ${d.name}</td><td><span style="color:var(--gold)">${'★'.repeat(b.stars)}${'☆'.repeat(3 - b.stars)}</span> ${b.score}</td></tr>`; }).join('')}
        <tr class="tot"><td>Best total · ${stars}/21 stars</td><td>${total}</td></tr></table>
      <div class="row"><button class="btn" data-a="again">Journey again</button><button class="btn ghost" data-a="map">Journey map</button></div>`,
      { again: () => this.start(1), map: () => this.openMap() });
  },
  showOver(msg = '') {
    const lv = this.lv, canReward = CG.rewardedAvailable && !this.rewardUsed && lv.cp;
    const reward = canReward ? `<div class="row eq" id="rw"><button class="btn" data-a="watch">${PLAY_ICON}Watch an ad to continue from this checkpoint</button><button class="btn ghost" data-a="nothanks">No thanks</button></div>` : '';
    const rest = `<div class="row" id="rest" ${canReward ? 'hidden' : ''}><button class="btn" data-a="retry">Try again</button><button class="btn ghost" data-a="map">Map</button></div>`;
    UI.card(`<h2>Rest, then rise again</h2><div class="sub">Hanuman gathers his strength. Rama's mission awaits.</div>${reward}${rest}<div class="msg" id="omsg">${msg}</div>`, {
      watch: () => {
        this.rewardUsed = true;
        CG.rewarded(() => { this.scene = 'level'; this.paused = false; UI.hideCard(); lv.continueFromCheckpoint(); },
          () => { $('#omsg').textContent = 'No ad available, try again later'; const rw = $('#rw'); if (rw) rw.hidden = true; $('#rest').hidden = false; });
      },
      nothanks: () => { $('#rw').hidden = true; $('#rest').hidden = false; },
      retry: () => this.start(lv.id), map: () => this.openMap()
    });
  },
  openMap() {
    this.prevScene = this.scene; this.scene = 'map'; UI.hideCard(); buildMap(); $('#mapS').hidden = false;
    $('#mapBack').hidden = !(this.lv && !this.lv.ended && this.prevScene === 'level');
  },
  closeMap() { $('#mapS').hidden = true; this.scene = 'level'; this.paused = false; this.pause(); }, // back to the pause card
  pickLevel(id) {
    const def = LEVELS[id - 1];
    if (id > Save.data.unlocked) { UI.toast('Complete the previous trial first'); return; }
    if (!def.make) { UI.toast(`${def.name} is coming in the next build`); return; }
    this.start(id);
  }
};
$('#bPause').addEventListener('click', () => { Sound.init(); Game.togglePause(); });
$('#bMap').addEventListener('click', () => { Sound.init(); if (Game.playing) { Game.pause(); } if (Game.scene === 'level' && Game.paused) Game.openMap(); });
$('#bMute').addEventListener('click', () => {
  Sound.init();
  if (Sound.sdkMuted) { UI.toast('Sound is muted in CrazyGames settings'); return; }
  Sound.muted = !Sound.muted; Save.data.muted = Sound.muted; Save.store(); Sound.apply(); UI.syncMute();
});
$('#mapBack').addEventListener('click', () => Game.closeMap());

function buildMap() {
  const N = [[95, 400], [235, 300], [370, 380], [505, 285], [640, 355], [770, 262], [895, 335]];
  const best = Save.data.best, un = Save.data.unlocked;
  let s = `<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d63b5"/><stop offset="1" stop-color="#0d2a66"/></linearGradient>
    <radialGradient id="gl"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient></defs>
    <rect width="1000" height="560" rx="24" fill="url(#sea)"/>
    <path d="M0 0H150C120 120 170 230 115 330C80 400 140 470 70 560H0Z" fill="#2f7a4f" stroke="#2a1206" stroke-width="4"/>
    <path d="M30 380L80 300L120 360L95 400Z" fill="#1e5a3e" stroke="#2a1206" stroke-width="3"/>
    <path d="M760 160C860 120 980 170 990 280C1000 400 920 520 820 500C730 480 700 400 720 300C730 230 730 180 760 160Z" fill="#3a8f5a" stroke="#2a1206" stroke-width="4"/>
    <g fill="#ffc83d" stroke="#2a1206" stroke-width="2"><rect x="800" y="200" width="16" height="44"/><rect x="824" y="186" width="18" height="58"/><rect x="850" y="206" width="14" height="38"/><path d="M800 200l8-14 8 14M824 186l9-16 9 16M850 206l7-12 7 12"/></g>
    <path d="M95 400C160 300 190 300 235 300S320 385 370 380S460 280 505 285S600 365 640 355S730 255 770 262S870 345 895 335" fill="none" stroke="#fff4dc" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>`;
  LEVELS.forEach((d, i) => {
    const [x, y] = N[i], open = d.id <= un, b = best[d.id], ready = !!d.make;
    const fill = b ? '#ffc83d' : open ? '#ff9933' : '#5a5680';
    s += `<g class="node" data-id="${d.id}" role="button" tabindex="0" aria-label="${d.id}. ${d.name}${open ? '' : ' (locked)'}" opacity="${open ? 1 : .7}">
      ${open && !b ? `<circle cx="${x}" cy="${y}" r="44" fill="url(#gl)"/>` : ''}
      <circle class="ring" cx="${x}" cy="${y}" r="27" fill="${fill}" stroke="#2a1206" stroke-width="4"/>
      <text x="${x}" y="${y + 9}" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="26" fill="#2a1206">${open ? d.id : '🔒'}</text>
      <text x="${x}" y="${y + 52}" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="700" font-size="19" fill="#fff4dc" stroke="#2a1206" stroke-width="4" paint-order="stroke">${d.name}</text>
      ${b ? `<text x="${x}" y="${y - 36}" text-anchor="middle" font-size="20" fill="#ffc83d" stroke="#2a1206" stroke-width="3" paint-order="stroke">${'★'.repeat(b.stars)}${'☆'.repeat(3 - b.stars)}</text>` : ''}
      ${open && !ready ? `<text x="${x}" y="${y + 72}" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-size="14" fill="#ffd9a0">coming soon</text>` : ''}
    </g>`;
  });
  const svg = $('#mapSvg'); svg.innerHTML = s;
  svg.querySelectorAll('.node').forEach(n => {
    const go = () => { Sound.init(); Game.pickLevel(+n.dataset.id); };
    n.addEventListener('click', go); n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

// ---------- auto-pause when hidden ----------
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Game.pause(); Input.reset(); Sound.suspend(); } else Sound.resume();
});

// ---------- loop (fixed 240 Hz step, render every frame) ----------
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > .25) dt = .25;
  Sound.tick();
  const lv = Game.lv, run = lv && !CG.adPlaying && ((Game.scene === 'level' && !Game.paused) || Game.scene === 'results' || Game.scene === 'over');
  if (run) {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 120) { lv.update(STEP); acc -= STEP; n++; }
    if (n) Input.pressed.clear();
  } else { acc = 0; Input.pressed.clear(); }
  // gameplay state for the SDK, and HUD-level DOM visibility
  CG.setGameplay(Game.playing && !CG.adPlaying);
  const inLevel = Game.scene === 'level';
  show($('#bPause'), inLevel && !Game.paused); show($('#bMap'), inLevel && !Game.paused);
  show($('#touch'), Game.touch && Game.playing);
  show($('#bGlow'), Game.touch && Game.playing && lv.dev >= 100);
  // draw
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#0d0a24'; cx.fillRect(0, 0, cv.width, cv.height);
  const k = View.dpr * View.s;
  cx.setTransform(k, 0, 0, k, View.dpr * View.offX, View.dpr * View.offY);
  cx.save(); cx.beginPath(); cx.rect(0, 0, View.w, VH); cx.clip();
  if (lv) lv.draw(cx);
  cx.restore();
}

// ---------- boot ----------
(async function boot() {
  Save.load(); Sound.muted = Save.data.muted; resize(); UI.syncMute();
  Game.start(1); // land straight in gameplay
  requestAnimationFrame(t => { last = t; frame(t); });
  await CG.init(); UI.syncMute();
})();
</script>
</body>
</html>
